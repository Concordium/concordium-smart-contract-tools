name: Create and publish a Docker image for verifiable-sc.

on:
  workflow_dispatch: # allows manual trigger

  push:
    tags:
      - 'verifiable-sc/*'

env:
  REGISTRY: docker.io
  # Rust version to use for the verifiable build image base image. Notice that the image will install the needed toolchain when
  # building the smart contract. We just need an image with some Rust toolchain.
  VERIFIABLE_IMAGE_BASE_RUST_VERSION: 1.85
  IMAGE_VERSION: 1

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    environment: docker-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Docker image
        run: docker build -f ./reproducible/build.Dockerfile --build-arg source_image="rust:$VERIFIABLE_IMAGE_BASE_RUST_VERSION" -t "concordium/verifiable-sc:$IMAGE_VERSION" ./reproducible
      - name: Install wasm32v1-none target
        run: |
          rustup target add wasm32v1-none
      - name: Test smart contract
        working-directory: ./reproducible
        run: ./run-test.sh "concordium/verifiable-sc:$IMAGE_VERSION"
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the image
        run: docker push "concordium/verifiable-sc:$IMAGE_VERSION"
